$schema: http://json-schema.org/draft-04/schema#
title: Datastream object
description: Schema for Sensor things API 1.3 Datastream, inferred from OpenAPI implementations
type: object
properties:
  '@iot.id':
    type:
    - string
    - number
    description: The Id of the observation
    x-jsonld-id: '@id'
  '@iot.selfLink':
    type: string
    description: The direct link to the entity
    x-jsonld-id: http://www.opengis.net/def/rel/iana/1.0/self
  Observations@iot.navigationLink:
    type: string
    description: Reference link to stream of Observations.
    x-jsonld-id: http://www.w3.org/ns/sosa/hasMember
    x-jsonld-type: '@id'
x-jsonld-extra-terms:
  name: http://purl.org/dc/terms/title
  description: http://purl.org/dc/terms/description
  observationType:
    x-jsonld-id: http://www.w3.org/ns/sosa/Observation
    x-jsonld-type: '@id'
  unitOfMeasurement:
    x-jsonld-id: http://qudt.org/schema/qudt/unit
    x-jsonld-context:
      name: https://schema.org/name
      symbol: https://schema.org/symbol
      definition: '@id'
  observedArea: http://www.opengis.net/ont/geosparql#hasGeometry
  phenomenonTime: http://www.w3.org/ns/sosa/phenomenonTime
  resultTime: http://www.w3.org/ns/sosa/resultTime
  ObservedProperty@iot.navigationLink:
    x-jsonld-id: http://www.w3.org/ns/sosa/observedProperty
    x-jsonld-type: '@id'
  Sensor@iot.navigationLink:
    x-jsonld-id: http://www.w3.org/ns/sosa/madeBySensor
    x-jsonld-type: '@id'
  Thing@iot.navigationLink:
    x-jsonld-id: http://www.w3.org/ns/sosa/oms/madeOnPlatform
    x-jsonld-type: '@id'
x-jsonld-prefixes:
  dct: http://purl.org/dc/terms/
  qudt: http://qudt.org/schema/qudt/
  sdo: https://schema.org/
  geo: http://www.opengis.net/ont/geosparql#
  sosa-oms: http://www.w3.org/ns/sosa/oms/
  orel: http://www.opengis.net/def/rel/
x-bblocks-metadata:
  itemIdentifier: ogc.api.sta.Datastream
  register: https://british-oceanographic-data-centre.github.io/bblocks-sta/build/register.json
  version: '0.1'
  dateOfLastChange: '2026-11-09'
